name: IceFinder Inventory Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Ping IceFinder Sync Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Sync
        run: |
          curl -i -X GET "https://icefinder-ecru.vercel.app/api/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail \
            --max-time 300
```[cite: 13]

4. Click the green **Commit changes...** button at the top right.
5. Choose **Commit directly to the `main` branch** and confirm.

