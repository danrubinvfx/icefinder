name: IceFinder Inventory Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Ping IceFinder Sync Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Sync
        run: |
          curl -i -X GET "https://icefinder-ecru.vercel.app/api/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail \
            --max-time 300
```[cite: 13]

> **Check:** Ensure the file ends at line 18 (`--max-time 300`)[cite: 13]. If there is a line 19, delete it.

---

### Step 4: Commit Directly to `main`

1. Click the green **Commit changes...** button in the upper right[cite: 11].
2. Confirm that **Commit directly to the `main` branch** is selected[cite: 11].
3. Click **Commit changes**[cite: 11].

---

### Step 5: Run the Workflow

1. Navigate to:  
   👉 **[https://github.com/danrubinvfx/icefinder/actions/workflows/sync-ice.yml](https://github.com/danrubinvfx/icefinder/actions/workflows/sync-ice.yml)**[cite: 11]
2. With the file containing valid YAML, GitHub will parse `workflow_dispatch` properly[cite: 13], and the **`Run workflow ▾`** button will appear in the top-right corner[cite: 2, 11].
3. Click **`Run workflow ▾`** $\to$ click the green **`Run workflow`** button[cite: 2, 11].

Once running, the scraper will execute with the full 300-second window[cite: 2] and finish with a solid green checkmark.
