name: IceFinder Inventory Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Ping IceFinder Sync Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Sync
        run: |
          curl -i -X GET "https://icefinder-ecru.vercel.app/api/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail \
            --max-time 300
```[cite: 13]

4. Click the green **Commit changes...** button at the top right.
5. Select **Commit directly to the `main` branch** and confirm.

---

### Why this fixes both problems:
* **No YAML syntax error:** Proper 2-space indentation ensures GitHub parses lines 15–20 without line 19 flagging an error[cite: 6, 13].
* **Enables the manual button:** Because `workflow_dispatch:` is now parsed correctly on `main`[cite: 13], the **"Run workflow ▾"** button will immediately appear at **[https://github.com/danrubinvfx/icefinder/actions/workflows/sync-ice.yml](https://github.com/danrubinvfx/icefinder/actions/workflows/sync-ice.yml)**[cite: 2, 5].
